[project]
name = "rep"
version = "0.0.0"
description = "Personal retrieval practice: readings to items, FSRS scheduling, sessions as data."
requires-python = ">=3.12"
# Zero runtime dependencies is a decision (PLAN.md D13), not an accident.
dependencies = []

[project.scripts]
rep = "rep.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pyright>=1.1.405",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
