[project]
name = "rep"
version = "0.0.0"
description = "Personal retrieval practice: readings to items, FSRS scheduling, sessions as data."
requires-python = ">=3.12"
# PLAN.md D13: no third-party runtime dependency. pyutils is the person's
# own package (PLAN.md D46), imported only by the session (`rep review`
# prints one plain line and does not load it).
dependencies = ["pyutils"]

[project.scripts]
rep = "rep.cli:main"

# A sibling directory in the explorations repository, on both machines.
[tool.uv.sources]
pyutils = { path = "../pyutils", editable = true }

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pyright>=1.1.405",
    "hypothesis>=6.140",
    "fsrs==6.3.2",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
